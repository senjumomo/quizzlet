<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizPulse — Google Sheet Trivia Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #10b981;
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.25);
      --error: #f43f5e;
      --error-glow: rgba(244, 63, 94, 0.25);
      --radius-lg: 24px;
      --radius-md: 14px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    .bg-glow-1 {
      position: fixed;
      top: -15%;
      left: 10%;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
      filter: blur(40px);
    }

    .bg-glow-2 {
      position: fixed;
      bottom: -15%;
      right: 10%;
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
      filter: blur(50px);
    }

    .app-card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      max-width: 660px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
    }

    .app-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #c7d2fe, #e0e7ff 40%, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sheet-link-btn {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .sheet-link-btn:hover {
      background: rgba(16, 185, 129, 0.25);
    }

    .audio-toggle-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .audio-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    @media (max-width: 580px) {
      .form-grid { grid-template-columns: 1fr; }
      .app-card { padding: 24px 20px; }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    select, input[type="number"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(10, 15, 29, 0.8);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus, input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .primary-btn {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .primary-btn:hover {
      background: linear-gradient(135deg, #7175f7, #5950ee);
      transform: translateY(-1px);
    }

    .quiz-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .tag-category {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
    }

    .tag-subcategory {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
    }

    .tag-source {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .tag-difficulty.easy {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .tag-difficulty.medium {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fcd34d;
    }

    .tag-difficulty.hard {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }

    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #fb923c;
      background: rgba(251, 146, 60, 0.12);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(251, 146, 60, 0.3);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #10b981);
      width: 0%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .question-title {
      font-size: 1.28rem;
      font-weight: 700;
      line-height: 1.45;
      color: var(--text);
      margin-bottom: 24px;
      min-height: 56px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      color: var(--text);
      font-size: 0.98rem;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .option-card:hover:not(:disabled) {
      background: rgba(99, 102, 241, 0.1);
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateX(4px);
    }

    .option-key {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .option-card:hover:not(:disabled) .option-key {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .option-card.correct {
      background: var(--success-glow) !important;
      border-color: var(--success) !important;
      color: #a7f3d0 !important;
    }

    .option-card.correct .option-key {
      background: var(--success) !important;
      color: #064e3b !important;
    }

    .option-card.wrong {
      background: var(--error-glow) !important;
      border-color: var(--error) !important;
      color: #fecdd3 !important;
    }

    .option-card.wrong .option-key {
      background: var(--error) !important;
      color: #881337 !important;
    }

    .next-action {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .q-counter {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .result-box {
      text-align: center;
      padding: 12px 0;
    }

    .score-badge-circle {
      width: 140px;
      height: 140px;
      margin: 0 auto 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, rgba(16, 185, 129, 0.05) 70%);
      border: 3px solid rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
    }

    .score-huge {
      font-size: 2.4rem;
      font-weight: 800;
      color: white;
    }

    .score-sub {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .result-headline {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .result-subhead {
      color: var(--text-muted);
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 12px 8px;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
    }

    .hidden { display: none !important; }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.08);
      border-left-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 40px auto 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <canvas id="confetti-canvas"></canvas>

  <div class="app-card">
    <div class="app-brand">
      <div class="brand-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        <span>QuizPulse</span>
      </div>
      <div class="header-actions">
        <a href="https://docs.google.com/spreadsheets/d/1o3kNHih-35T5-ssvNaJ9i4TAs38zSQHKyhBqTZ9AYX4/edit" target="_blank" class="sheet-link-btn" title="Open Google Sheet in Drive">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm4-4H6v-2h10v2zm0-4H6V7h10v2z"/>
          </svg>
          <span>Edit Sheet DB</span>
        </a>
        <button id="sound-toggle" class="audio-toggle-btn" title="Toggle Sound FX">
          <svg id="sound-on-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="sound-off-icon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- 1. Setup / Config -->
    <div id="setup-view">
      <div class="form-grid">
        <div class="form-group">
          <label for="num-questions">Questions</label>
          <input type="number" id="num-questions" min="1" max="50" value="10">
        </div>

        <div class="form-group">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="">Any Level</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">Any Category</option>
            <option value="Mythology" selected>Mythology</option>
            <option value="Science">Science</option>
            <option value="History">History</option>
            <option value="General Knowledge">General Knowledge</option>
            <option value="Entertainment">Entertainment</option>
          </select>
        </div>

        <div class="form-group">
          <label for="subcategory">Subcategory</label>
          <select id="subcategory">
            <option value="">Any Subcategory</option>
            <option value="Greek">Greek</option>
            <option value="Norse">Norse</option>
            <option value="Egyptian">Egyptian</option>
            <option value="Roman">Roman</option>
            <option value="Japanese">Japanese</option>
            <option value="Hindu">Hindu</option>
            <option value="Celtic">Celtic</option>
            <option value="Aztec">Aztec</option>
            <option value="Mesopotamian">Mesopotamian</option>
            <option value="Chinese">Chinese</option>
            <option value="Polynesian">Polynesian</option>
            <option value="Slavic">Slavic</option>
            <option value="Finnish">Finnish</option>
            <option value="Arthurian">Arthurian</option>
          </select>
        </div>
      </div>

      <button id="start-btn" class="primary-btn">
        <span>Start Challenge</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>

    <!-- 2. Loading State -->
    <div id="loading-view" class="hidden">
      <div class="spinner"></div>
      <p id="loading-msg" style="text-align: center; color: var(--text-muted); font-size: 0.95rem;">Loading questions from your Google Sheet...</p>
    </div>

    <!-- 3. Quiz Gameplay -->
    <div id="quiz-view" class="hidden">
      <div class="quiz-meta-bar">
        <div class="meta-left">
          <span id="category-tag" class="tag tag-category">Mythology</span>
          <span id="subcategory-tag" class="tag tag-subcategory">Greek</span>
          <span class="tag tag-source">Google Sheet</span>
          <span id="difficulty-tag" class="tag tag-difficulty easy">Easy</span>
        </div>
        <div id="streak-indicator" class="streak-badge">
          <span>🔥</span> <span id="streak-count">0</span>
        </div>
      </div>

      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <h2 id="question-text" class="question-title"></h2>

      <div id="options-container" class="options-list"></div>

      <div class="next-action">
        <span id="question-counter" class="q-counter">1 of 10</span>
        <button id="next-btn" class="primary-btn hidden" style="width: auto; min-width: 140px; padding: 10px 20px;">
          <span>Next</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>

      </div>
    </div>

    <!-- 4. Results Screen -->
    <div id="results-view" class="hidden">
      <div class="result-box">
        <div class="score-badge-circle">
          <span id="final-score" class="score-huge">8</span>
          <span class="score-sub">Total Correct</span>
        </div>

        <h3 id="result-title" class="result-headline">Outstanding!</h3>
        <p id="result-desc" class="result-subhead">You mastered your Google Sheet trivia database.</p>

        <div class="stats-row">
          <div class="stat-card">
            <div id="stat-accuracy" class="stat-val">80%</div>
            <div class="stat-label">Accuracy</div>
          </div>
          <div class="stat-card">
            <div id="stat-max-streak" class="stat-val">4</div>
            <div class="stat-label">Best Streak</div>
          </div>
          <div class="stat-card">
            <div id="stat-time" class="stat-val">42s</div>
            <div class="stat-label">Total Time</div>
          </div>
        </div>

        <button id="restart-btn" class="primary-btn">Play Another Round</button>
      </div>
    </div>
  </div>

  <script>
    // Hardcoded connection strictly to your Google Sheet database
    const SPREADSHEET_ID = '1o3kNHih-35T5-ssvNaJ9i4TAs38zSQHKyhBqTZ9AYX4';

    // Sound FX via Web Audio API
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      }
      playCorrect() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc.start(now);
        osc.stop(now + 0.3);
      }
      playWrong() {
        if (!this.enabled) return;
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.2);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
      playFinish() {
        if (!this.enabled) return;
        this.init();
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          const now = this.ctx.currentTime + (idx * 0.1);
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        });
      }
    }

    const sfx = new SoundFX();

    // Canvas Confetti
    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = Array.from({ length: 90 }).map(() => ({
        x: canvas.width / 2,
        y: canvas.height * 0.45,
        r: Math.random() * 5 + 3,
        color: ['#6366f1', '#10b981', '#38bdf8', '#f59e0b', '#ec4899'][Math.floor(Math.random() * 5)],
        vx: (Math.random() - 0.5) * 14,
        vy: (Math.random() - 0.5) * 14 - 3,
        gravity: 0.35,
        friction: 0.96
      }));

      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.vx *= p.friction;
          p.vy *= p.friction;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        });
        frame++;
        if (frame < 120) requestAnimationFrame(animate);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      animate();
    }

    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let currentStreak = 0;
    let maxStreak = 0;
    let startTime = null;
    let hasAnswered = false;

    const setupView = document.getElementById('setup-view');
    const loadingView = document.getElementById('loading-view');
    const loadingMsg = document.getElementById('loading-msg');
    const quizView = document.getElementById('quiz-view');
    const resultsView = document.getElementById('results-view');

    const startBtn = document.getElementById('start-btn');
    const nextBtn = document.getElementById('next-btn');
    const restartBtn = document.getElementById('restart-btn');
    const soundToggle = document.getElementById('sound-toggle');
    const soundOnIcon = document.getElementById('sound-on-icon');
    const soundOffIcon = document.getElementById('sound-off-icon');

    const progressFill = document.getElementById('progress-fill');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const categoryTag = document.getElementById('category-tag');
    const subcategoryTag = document.getElementById('subcategory-tag');
    const difficultyTag = document.getElementById('difficulty-tag');
    const streakIndicator = document.getElementById('streak-indicator');
    const streakCount = document.getElementById('streak-count');
    const questionCounter = document.getElementById('question-counter');

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    soundToggle.addEventListener('click', () => {
      sfx.enabled = !sfx.enabled;
      soundOnIcon.classList.toggle('hidden', !sfx.enabled);
      soundOffIcon.classList.toggle('hidden', sfx.enabled);
    });

    // ========================================================
    // JSONP GOOGLE SHEETS FETCHER (Bypasses all CORS on Android)
    // ========================================================
    function loadGoogleSheetViaJSONP(sheetId) {
      return new Promise((resolve, reject) => {
        const scriptId = 'gviz_script_' + Date.now();

        window.google = window.google || {};
        window.google.visualization = window.google.visualization || {};
        window.google.visualization.Query = {
          setResponse: function(response) {
            cleanup();
            if (response && response.status === 'ok' && response.table && response.table.rows) {
              resolve(response.table);
            } else {
              reject(new Error(response?.errors ? response.errors[0]?.message : 'Could not read table data from Google Sheet.'));
            }
          }
        };

        const script = document.createElement('script');
        script.id = scriptId;
        script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?headers=1&t=${Date.now()}`;

        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('Connection timed out. Ensure your Google Sheet is shared with "Anyone with the link can view".'));
        }, 9000);

        function cleanup() {
          clearTimeout(timer);
          const el = document.getElementById(scriptId);
          if (el) el.remove();
        }

        script.onerror = () => {
          cleanup();
          reject(new Error('Failed to reach Google Sheet. Check your connection or share permissions.'));
        };

        document.head.appendChild(script);
      });
    }

    // Map to hold categories and their subcategories
    let categorySubcategoryMap = {};

    function updateSubcategoryDropdown() {
      const catSelect = document.getElementById('category');
      const subcatSelect = document.getElementById('subcategory');
      const selectedCat = catSelect.value;
      const currentVal = subcatSelect.value;

      subcatSelect.innerHTML = '<option value="">Any Subcategory</option>';

      let subcats = new Set();
      if (selectedCat && categorySubcategoryMap[selectedCat]) {
        categorySubcategoryMap[selectedCat].forEach(s => subcats.add(s));
      } else if (!selectedCat) {
        Object.values(categorySubcategoryMap).forEach(set => {
          set.forEach(s => subcats.add(s));
        });
      }

      const sortedSubcats = Array.from(subcats).sort();
      sortedSubcats.forEach(sub => {
        const opt = document.createElement('option');
        opt.value = sub;
        opt.textContent = sub;
        if (sub === currentVal) opt.selected = true;
        subcatSelect.appendChild(opt);
      });

      subcatSelect.disabled = sortedSubcats.length === 0;
    }

    document.getElementById('category').addEventListener('change', updateSubcategoryDropdown);

    // Auto-discover unique categories and subcategories from Google Sheet on page load
    async function syncCategoriesFromSheet() {
      try {
        const table = await loadGoogleSheetViaJSONP(SPREADSHEET_ID);
        if (table?.rows?.length > 0) {
          categorySubcategoryMap = {};
          table.rows.forEach(r => {
            const cat = r.c && r.c[0] ? String(r.c[0].v).trim() : '';
            const sub = r.c && r.c[1] ? String(r.c[1].v).trim() : '';
            if (cat) {
              if (!categorySubcategoryMap[cat]) {
                categorySubcategoryMap[cat] = new Set();
              }
              if (sub && sub.toLowerCase() !== 'general') {
                categorySubcategoryMap[cat].add(sub);
              }
            }
          });

          const categories = Object.keys(categorySubcategoryMap).sort();
          if (categories.length > 0) {
            const select = document.getElementById('category');
            select.innerHTML = '<option value="">Any Category</option>';
            categories.forEach(cat => {
              const opt = document.createElement('option');
              opt.value = cat;
              opt.textContent = cat;
              if (cat.toLowerCase() === 'mythology') opt.selected = true;
              select.appendChild(opt);
            });
            updateSubcategoryDropdown();
          }
        }
      } catch (e) {
        console.warn('Initial category sync using defaults:', e);
      }
    }
    syncCategoriesFromSheet();

    // Query questions strictly from your Google Sheet
    async function startQuiz() {
      const requestedAmount = parseInt(document.getElementById('num-questions').value, 10) || 10;
      const categoryFilter = document.getElementById('category').value;
      const subcategoryFilter = document.getElementById('subcategory').value;
      const difficultyFilter = document.getElementById('difficulty').value;

      setupView.classList.add('hidden');
      loadingView.classList.remove('hidden');
      loadingMsg.textContent = 'Fetching questions directly from your Google Sheet...';

      try {
        const table = await loadGoogleSheetViaJSONP(SPREADSHEET_ID);
        if (!table.rows || table.rows.length === 0) {
          throw new Error('Your Google Sheet appears to be empty.');
        }

        // Parse rows: [Category, Subcategory, Difficulty, Question, Correct Answer, Incorrect 1, Incorrect 2, Incorrect 3]
        let allQuestions = table.rows.map(row => {
          const c = row.c || [];
          return {
            category: c[0]?.v ? String(c[0].v).trim() : 'General Knowledge',
            subcategory: c[1]?.v ? String(c[1].v).trim() : 'General',
            difficulty: c[2]?.v ? String(c[2].v).toLowerCase().trim() : 'medium',
            question: c[3]?.v ? String(c[3].v).trim() : '',
            correct_answer: c[4]?.v ? String(c[4].v).trim() : '',
            incorrect_answers: [c[5]?.v, c[6]?.v, c[7]?.v].filter(Boolean).map(v => String(v).trim())
          };
        }).filter(q => q.question && q.correct_answer && q.incorrect_answers.length > 0);

        // Apply Category Filter
        if (categoryFilter && categoryFilter.trim() !== '') {
          const target = categoryFilter.toLowerCase();
          allQuestions = allQuestions.filter(q => q.category.toLowerCase().includes(target) || target.includes(q.category.toLowerCase()));
        }

        // Apply Subcategory Filter
        if (subcategoryFilter && subcategoryFilter.trim() !== '') {
          const targetSub = subcategoryFilter.toLowerCase();
          allQuestions = allQuestions.filter(q => q.subcategory && q.subcategory.toLowerCase() === targetSub);
        }

        // Apply Difficulty Filter
        if (difficultyFilter && difficultyFilter.trim() !== '') {
          allQuestions = allQuestions.filter(q => q.difficulty === difficultyFilter.toLowerCase());
        }

        if (allQuestions.length === 0) {
          const filterDetails = [
            categoryFilter || 'Any Category',
            subcategoryFilter ? `Subcategory: ${subcategoryFilter}` : null,
            `Difficulty: ${difficultyFilter || 'Any'}`
          ].filter(Boolean).join(' | ');
          throw new Error(`No questions found matching (${filterDetails}). Try different filters or add questions to your Google Sheet.`);
        }

        // Shuffle and slice requested amount
        questions = shuffle(allQuestions).slice(0, requestedAmount);
        currentIndex = 0;
        score = 0;
        currentStreak = 0;
        maxStreak = 0;
        startTime = Date.now();

        loadingView.classList.add('hidden');
        quizView.classList.remove('hidden');
        renderQuestion();
      } catch (err) {
        alert(err.message || 'Error reading from Google Sheet.');
        loadingView.classList.add('hidden');
        setupView.classList.remove('hidden');
      }
    }

    function renderQuestion() {
      hasAnswered = false;
      nextBtn.classList.add('hidden');

      const q = questions[currentIndex];
      questionText.textContent = q.question;
      categoryTag.textContent = q.category;

      if (q.subcategory && q.subcategory.toLowerCase() !== 'general') {
        subcategoryTag.textContent = q.subcategory;
        subcategoryTag.style.display = 'inline-block';
      } else {
        subcategoryTag.style.display = 'none';
      }

      difficultyTag.textContent = q.difficulty;
      difficultyTag.className = `tag tag-difficulty ${q.difficulty}`;

      questionCounter.textContent = `${currentIndex + 1} of ${questions.length}`;
      progressFill.style.width = `${((currentIndex) / questions.length) * 100}%`;
      streakCount.textContent = currentStreak;

      optionsContainer.innerHTML = '';
      const choices = shuffle([...q.incorrect_answers, q.correct_answer]);
      const keyLabels = ['A', 'B', 'C', 'D'];

      choices.forEach((choice, idx) => {
        const card = document.createElement('button');
        card.className = 'option-card';
        card.innerHTML = `
          <span class="option-key">${keyLabels[idx] || (idx + 1)}</span>
          <span class="option-text">${choice}</span>
        `;
        card.addEventListener('click', () => selectAnswer(choice, q.correct_answer, card));
        optionsContainer.appendChild(card);
      });
    }

    function selectAnswer(selected, correct, cardElement) {
      if (hasAnswered) return;
      hasAnswered = true;

      const isCorrect = selected === correct;

      if (isCorrect) {
        score++;
        currentStreak++;
        if (currentStreak > maxStreak) maxStreak = currentStreak;
        cardElement.classList.add('correct');
        sfx.playCorrect();

        streakIndicator.classList.add('pop');
        setTimeout(() => streakIndicator.classList.remove('pop'), 200);
      } else {
        currentStreak = 0;
        cardElement.classList.add('wrong');
        sfx.playWrong();

        Array.from(optionsContainer.children).forEach(btn => {
          if (btn.querySelector('.option-text').textContent === correct) {
            btn.classList.add('correct');
          }
        });
      }

      streakCount.textContent = currentStreak;
      Array.from(optionsContainer.children).forEach(btn => btn.disabled = true);

      nextBtn.classList.remove('hidden');
      nextBtn.querySelector('span').textContent = (currentIndex + 1 < questions.length) ? 'Next' : 'Results';
    }

    function handleNext() {
      currentIndex++;
      if (currentIndex < questions.length) {
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      progressFill.style.width = '100%';
      quizView.classList.add('hidden');
      resultsView.classList.remove('hidden');

      const elapsedSec = Math.round((Date.now() - startTime) / 1000);
      const accuracy = Math.round((score / questions.length) * 100);

      document.getElementById('final-score').textContent = score;
      document.getElementById('stat-accuracy').textContent = `${accuracy}%`;
      document.getElementById('stat-max-streak').textContent = maxStreak;
      document.getElementById('stat-time').textContent = `${elapsedSec}s`;

      const titleEl = document.getElementById('result-title');
      const descEl = document.getElementById('result-desc');

      if (accuracy >= 80) {
        titleEl.textContent = accuracy === 100 ? 'Perfection!' : 'Mastermind!';
        descEl.textContent = 'Outstanding accuracy on your Google Sheet questions.';
        launchConfetti();
        sfx.playFinish();
      } else if (accuracy >= 50) {
        titleEl.textContent = 'Solid Run!';
        descEl.textContent = 'Well done! Practice makes perfect.';
      } else {
        titleEl.textContent = 'Keep Training!';
        descEl.textContent = 'Review your spreadsheet and try again.';
      }
    }

    window.addEventListener('keydown', (e) => {
      if (quizView.classList.contains('hidden')) return;

      const key = e.key.toUpperCase();
      const keyMap = { 'A': 0, '1': 0, 'B': 1, '2': 1, 'C': 2, '3': 2, 'D': 3, '4': 3 };

      if (!hasAnswered && key in keyMap) {
        const btn = optionsContainer.children[keyMap[key]];
        if (btn) btn.click();
      } else if (hasAnswered && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        handleNext();
      }
    });

    startBtn.addEventListener('click', startQuiz);
    nextBtn.addEventListener('click', handleNext);
    restartBtn.addEventListener('click', () => {
      resultsView.classList.add('hidden');
      setupView.classList.remove('hidden');
    });
  </script>
</body>
</html>
